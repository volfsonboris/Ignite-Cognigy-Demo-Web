<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Contoso Bank voice call. An Ignite demo powered by Cognigy.">
    <title>Contoso Bank | Ignite demo</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
    <script defer src="demo.js"></script>
  </head>
  <body class="contoso-demo webrtc-position-centered">
    <header>
      <img src="contoso-bank.jpg" alt="Contoso Bank" width="200" height="80">
      <p>Ignite demo</p>
    </header>
    <main aria-label="Audio call">
      <p id="widget-status" role="status" aria-live="polite" data-state="loading">Loading call&hellip;</p>
      <noscript>Enable JavaScript to load the call widget.</noscript>
    </main>
    <footer>
      <span class="footer-wordmark">contoso.</span>
      <p>Contoso is a fictional company. Voice experience powered by Cognigy.</p>
    </footer>
  </body>
</html>
